name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn test

  e2e:
    name: E2E tests (Firebase emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: yarn
      # The Firebase Database emulator is a Java app
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: yarn install --frozen-lockfile

      # Avoid re-downloading the emulator .jar on every run
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('yarn.lock') }}

      - run: npx playwright install --with-deps chromium

      # Starts the emulator (demo project, no credentials needed), runs Playwright, shuts it down
      - run: yarn test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
